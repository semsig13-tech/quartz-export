name: Build TDOC Export plugin

on:
  push:
    branches: [main, integration-test]
  pull_request:
    branches: [main, integration-test]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Build plugin
        run: npm run build
